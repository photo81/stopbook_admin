<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑북 관리자 - 회원 유형 관리</title>
<link rel="stylesheet" href="admin.css?v=20261006">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">STOPBOOK Admin</div>
    <ul>
      <li class="has-sub open">
        <a href="#" class="menu-parent" aria-expanded="true">회원관리<span class="chev">▼</span></a>
        <ul class="submenu">
          <li><a href="members.html">회원 리스트</a></li>
          <li><a href="group-applications.html">단체 회원 신청 리스트</a></li>
          <li><a href="withdrawn.html">탈퇴회원 리스트</a></li>
          <li><a href="member-types.html" class="active" aria-current="page">회원 유형 관리</a></li>
        </ul>
      </li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">홈 &gt; 회원관리 &gt; <b>회원 유형 관리</b></div>
      <div>관리자님 | <a href="#">로그아웃</a></div>
    </header>

    <main class="content">
      <h1>회원 유형 관리</h1>

      <div class="tabs" role="tablist" id="tabs"></div>

      <!-- 등급 탭 전용: 회원 등급 평가 조건 -->
      <section class="panel" id="policyPanel" hidden>
        <div class="list-head">
          <div class="count">회원 등급 평가 조건 · 저장 시 다음 산정일부터 적용됩니다.</div>
        </div>
        <form id="policyForm" novalidate>
          <table class="form-table">
            <tbody id="policyRows"></tbody>
          </table>
          <div class="page-actions">
            <span class="readonly" id="runStatus" style="margin-right:auto"></span>
            <button type="button" class="btn" id="btnRunNow">지금 산정</button>
            <button type="submit" class="btn btn-primary">평가 조건 저장</button>
          </div>
        </form>
      </section>

      <section class="panel tab-panel" role="tabpanel" id="tabPanel">
        <div class="list-head">
          <div class="count" id="tabGuide"></div>
          <div class="right">
            <button type="button" class="btn btn-primary" id="btnAdd"></button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="listTable">
            <thead>
              <tr id="headRow"></tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- 항목 추가 모달 -->
<div class="modal-bg" id="addModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="modal-header">
      <h2 id="addTitle"></h2>
      <button type="button" class="close" data-close aria-label="닫기">&times;</button>
    </div>
    <form id="addForm" class="modal-body" novalidate>
      <div class="section-title">기본 정보</div>
      <table class="form-table">
        <tr><th id="addNameLabel"></th><td>
          <input type="text" id="aName" maxlength="20">
          <div class="err" id="eName"></div>
        </td></tr>
        <tr><th>설명</th><td><textarea id="aDesc" maxlength="300"></textarea></td></tr>
        <!-- 구분 탭 전용: 종류 (하나만 입력, 추가 종류는 상세에서 하나씩 등록) -->
        <tr id="addSubsRow" hidden><th>종류</th><td>
          <input type="text" id="aSubs" maxlength="20" placeholder="예) 학교">
          <div class="readonly at-note">하나만 입력합니다. 비워 두면 종류 없이 사용하며, 추가 종류는 상세에서 하나씩 등록합니다.</div>
          <div class="err" id="eSubs"></div>
        </td></tr>
      </table>

      <!-- 등급 탭 전용: 평가 기준 -->
      <div class="section-title" id="addCriteriaTitle" hidden>평가 기준</div>
      <table class="form-table" id="addCriteriaTable" hidden>
        <tbody id="addCriteriaRows"></tbody>
      </table>

      <div class="section-title">혜택 설정</div>
      <table class="form-table" id="addFlagTable">
        <tbody id="addFlagRows"></tbody>
        <tr><th>할인율</th><td>
          <input type="text" id="aRate" inputmode="numeric" style="width:100px" value="0"> %
          <span class="readonly" style="margin-left:8px">0~100 사이 정수</span>
          <div class="err" id="eRate">할인율은 0~100 사이의 정수로 입력하세요.</div>
        </td></tr>
      </table>
      <!-- 등급 탭 전용: 정기 지급 혜택 -->
      <table class="form-table" id="addGradeTable" hidden>
        <tbody id="addGradeRows"></tbody>
      </table>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn" data-close>취소</button>
      <button type="submit" form="addForm" class="btn btn-primary">추가</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="member-data.js?v=20261006"></script>
<script src="member-type-store.js?v=20261006"></script>
<script>
(function () {
  'use strict';
  const { esc, toast, fmtDateTime, initSidebar, ADMIN_NAME } = AdminUtil;
  const { load, save, flagsFor, checkSub, checkCategoryName, normalizeCategoryRefs, GradeBenefit, GradePolicy, GradeCriteria, GradeEvaluator } = MemberTypeStore;
  const $ = id => document.getElementById(id);
  const groups = load();
  const gradeGroup = groups.find(x => x.key === 'grade');
  gradeGroup.policy = Object.assign(GradePolicy.empty(), gradeGroup.policy);
  const SNS_TYPES = ['카카오회원', '네이버회원', '구글회원'];   // 로고 표시 대상 (admin.css .ty-*)

  const yn = (it, f) => `<span class="${it[f.key] ? 'yn-on' : 'yn-off'}">${it[f.key] ? f.on : f.off}</span>`;

  // 구분/유형 탭 목록 열: 탭에서 쓰는 혜택 항목을 하나씩 열로 표시
  const COLUMN_LABELS = { mileageEarn: '마일리지 적립', mileageUse: '마일리지 사용', couponUse: '쿠폰 사용', stackOther: '타할인중복', stackEvent: '이벤트중복', freeShipping: '무료배송' };
  const flagColumns = groupKey => flagsFor(groupKey).filter(f => COLUMN_LABELS[f.key]);

  // 상세에서 돌아올 때 같은 탭을 유지하도록 ?tab= 사용
  const params = new URLSearchParams(location.search);
  let current = groups.some(g => g.key === params.get('tab')) ? params.get('tab') : groups[0].key;

  function render() {
    const g = groups.find(x => x.key === current);
    $('tabs').innerHTML = groups.map(x => `
      <button type="button" role="tab" class="tab ${x.key === current ? 'active' : ''}"
        aria-selected="${x.key === current}" data-tab="${x.key}">${esc(x.label)} <span class="tab-count">${x.items.length}</span></button>`).join('');
    const isGrade = g.key === 'grade';
    const isCategory = g.key === 'category';
    $('policyPanel').hidden = !isGrade;
    const heads = isGrade
      ? [g.label, `평가 기준 (${GradePolicy.basisText(g.policy)})`, '지급 주기', '쿠폰', '마일리지 지급', '할인 적용', '설명']
      : [g.label, ...(isCategory ? ['종류'] : []), ...flagColumns(g.key).map(f => COLUMN_LABELS[f.key]), '할인율설정', '설명', ...(isCategory ? ['사용'] : [])];
    const numCols = isGrade ? [4, 5] : [];   // 숫자 열은 제목도 오른쪽 정렬
    // 구분/유형 탭: 설명을 뺀 열은 같은 너비로 고정, 설명은 남는 폭 사용
    $('listTable').classList.toggle('equal-cols', !isGrade);
    $('headRow').innerHTML = heads.map((h, i) => {
      const cls = h === '설명' ? ' class="col-desc"' : (isCategory && h === '사용') ? ' class="col-use"' : '';
      return `<th${cls}${numCols.includes(i) ? ' style="text-align:right"' : ''}>${h}</th>`;
    }).join('');
    $('btnAdd').textContent = `+ ${g.label} 추가`;
    $('tabGuide').textContent = isGrade
      ? '등급별 정기 지급 혜택 · 등급 이름을 누르면 상세 설정으로 이동합니다.'
      : `${g.label}별 혜택 설정 · ${g.label} 이름을 누르면 상세 설정으로 이동합니다.`;

    const nameCell = it => `<td><a class="name-link" href="member-type-detail.html?group=${encodeURIComponent(g.key)}&code=${encodeURIComponent(it.code)}">${SNS_TYPES.includes(it.name) ? `<span class="type-logo ty-${esc(it.name)}"></span>` : ''}${esc(it.name)}</a></td>`;
    const descCell = it => `<td class="left cat-desc" title="${esc(it.desc)}">${esc(it.desc)}</td>`;
    const off = t => `<span class="yn-off">${t}</span>`;

    $('listBody').innerHTML = g.items.map(it => {
      if (isGrade) {
        const b = it.benefit;
        const crit = GradeCriteria.text(it.criteria || GradeCriteria.empty(), g.policy.basis);
        return `<tr>
          ${nameCell(it)}
          <td>${crit === '기본 등급' ? off(crit) : esc(crit)}</td>
          <td>${b.cycle === 'none' ? off('지급 안 함') : esc(GradeBenefit.cycleText(b))}</td>
          <td class="cat-desc" title="${esc(b.coupons.join(', '))}">${b.coupons.length ? `<b>${b.coupons.length}종</b> <span class="readonly">${esc(b.coupons.join(', '))}</span>` : off('없음')}</td>
          <td class="num">${b.mileageOn ? GradeBenefit.mileageText(b) : off('없음')}</td>
          <td class="num">${b.discountOn ? GradeBenefit.discountText(b) : off('없음')}</td>
          ${descCell(it)}
        </tr>`;
      }
      const subs = it.subs || [];
      const subsCell = !isCategory ? ''
        : `<td class="cat-desc" title="${esc(subs.join(', '))}">${subs.length ? `<b>${subs.length}개</b> <span class="readonly">${esc(subs.join(', '))}</span>` : off('없음')}</td>`;
      // 구분 탭: 사용/숨김 토글. 숨긴 구분은 회원 정보·단체 신청의 선택지에서 빠짐 (이미 지정된 회원 값은 유지)
      const useCell = !isCategory ? ''
        : `<td><button type="button" class="use-toggle" role="switch" aria-checked="${!it.hidden}" data-code="${esc(it.code)}"
             aria-label="${esc(it.name)} ${it.hidden ? '숨김' : '사용'}"><span class="use-track"></span><span class="use-label">${it.hidden ? '숨김' : '사용'}</span></button></td>`;
      return `<tr${isCategory && it.hidden ? ' class="row-hidden"' : ''}>
        ${nameCell(it)}
        ${subsCell}
        ${flagColumns(g.key).map(f => `<td>${yn(it, f)}</td>`).join('')}
        <td>${it.discountRate}%</td>
        ${descCell(it)}
        ${useCell}
      </tr>`;
    }).join('');
  }

  // ===== 구분 사용/숨김 (토글 즉시 저장) =====
  // TODO: 실서비스에서는 PATCH /api/admin/member-types/category/{code} { hidden }
  $('listBody').addEventListener('click', e => {
    const b = e.target.closest('.use-toggle');
    if (!b) return;
    const g = groups.find(x => x.key === 'category');
    const it = g.items.find(x => x.code === b.dataset.code);
    if (!it) return;
    const hide = !it.hidden;
    // 회원 정보에서 고를 구분이 하나도 없어지지 않도록 마지막 사용 구분은 숨길 수 없음
    if (hide && g.items.filter(x => !x.hidden).length <= 1) { toast('사용 중인 구분이 하나 이상 있어야 합니다.'); return; }
    if (hide && !confirm(`'${it.name}' 구분을 숨기시겠습니까?\n회원 정보와 단체 회원 신청의 선택지에서 빠집니다. 이미 이 구분인 회원은 그대로 유지됩니다.`)) return;
    it.hidden = hide;
    it.history.push({ at: fmtDateTime(new Date()), content: `사용 상태 변경: ${hide ? '사용 → 숨김' : '숨김 → 사용'}`, by: ADMIN_NAME });
    const saved = save(groups);
    render();
    toast(saved ? `'${it.name}' 구분을 ${hide ? '숨겼습니다' : '사용합니다'}.` : '저장소를 사용할 수 없어 이 화면에만 반영되었습니다.');
  });

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b || b.dataset.tab === current) return;
    current = b.dataset.tab;
    try { history.replaceState(null, '', `?tab=${current}`); } catch (err) { /* file:// 등에서 차단될 수 있음 */ }
    render();
  });

  // ===== 회원 등급 평가 조건 (등급 탭 상단) =====
  $('policyRows').innerHTML = GradePolicy.formHtml('p');
  GradePolicy.bind('p');
  GradePolicy.fill('p', gradeGroup.policy);

  $('policyForm').addEventListener('submit', e => {
    e.preventDefault();
    const r = GradePolicy.read('p');
    if (r.error) return;
    // TODO: 실서비스에서는 PUT /api/admin/member-grades/policy 호출
    gradeGroup.policy = r.value;
    const saved = save(groups);
    render();   // 평가 기준이 바뀌면 목록의 평가 기준 열 표시도 달라짐
    renderRunStatus();
    toast(saved ? '회원 등급 평가 조건이 저장되었습니다.' : '저장소를 사용할 수 없어 이 화면에만 반영되었습니다.');
  });

  // ----- 등급 자동 산정 상태 / 수동 실행 -----
  // 산정 예정일이 지났으면 이 화면을 열 때도 실행 (회원 리스트와 동일). TODO: 실서비스에서는 서버 배치
  GradeEvaluator.run(MemberData.members, gradeGroup, MemberData.orderStats);

  function renderRunStatus() {
    const pol = gradeGroup.policy, run = GradeEvaluator.lastRun();
    const last = run.lastRunAt ? `마지막 산정 ${run.lastRunAt} (${run.lastChanged || 0}명 변경)` : '산정 이력 없음';
    const next = pol.auto ? `다음 산정 ${fmtDateTime(GradeEvaluator.nextScheduled(pol, new Date()))}` : '자동 등급 설정 미사용';
    $('runStatus').textContent = `${last} · ${next}`;
  }
  renderRunStatus();

  $('btnRunNow').addEventListener('click', () => {
    if (!confirm('저장된 평가 조건으로 전체 회원의 등급을 지금 산정하시겠습니까?\n조건을 수정했다면 먼저 저장해 주세요.')) return;
    const res = GradeEvaluator.run(MemberData.members, gradeGroup, MemberData.orderStats, { force: true });
    renderRunStatus();
    toast(`등급 산정 완료: ${res.changes.length}명 변경 (평가 기간 ${res.range.from} ~ ${res.range.to})`);
  });

  // ===== 항목 추가 모달 =====
  const renderAddFlagRows = groupKey => { $('addFlagRows').innerHTML = flagsFor(groupKey).map(f => `
    <tr><th>${f.label}</th><td>
      <label><input type="radio" name="a_${f.key}" value="Y"> ${f.on}</label>
      <label style="margin-left:12px"><input type="radio" name="a_${f.key}" value="N"> ${f.off}</label>
    </td></tr>`).join(''); };

  $('addGradeRows').innerHTML = GradeBenefit.formHtml('ag');
  GradeBenefit.bind('ag');

  const DEFAULT_FLAGS = { mileageEarn: true, mileageUse: true, couponUse: true, stackOther: false, stackEvent: true, freeShipping: false };

  function openAdd() {
    const g = groups.find(x => x.key === current);
    $('addTitle').textContent = `${g.label} 추가`;
    $('addNameLabel').textContent = `${g.label} 이름 *`;
    $('addForm').reset();
    renderAddFlagRows(g.key);
    flagsFor(g.key).forEach(f => { document.querySelector(`input[name=a_${f.key}][value=${DEFAULT_FLAGS[f.key] ? 'Y' : 'N'}]`).checked = true; });
    $('aRate').value = '0';
    const isGrade = g.key === 'grade';
    $('addFlagTable').hidden = isGrade;
    $('addGradeTable').hidden = !isGrade;
    $('addCriteriaTitle').hidden = !isGrade;
    $('addCriteriaTable').hidden = !isGrade;
    $('addSubsRow').hidden = g.key !== 'category';
    if (isGrade) {
      GradeBenefit.fill('ag', GradeBenefit.empty());
      // 평가 기준 입력란은 현재 평가 조건(주문금액/주문횟수)에 맞춰 구성
      $('addCriteriaRows').innerHTML = GradeCriteria.formHtml('ac', g.policy.basis);
      GradeCriteria.fill('ac', GradeCriteria.empty());
    }
    document.querySelectorAll('#addForm .err').forEach(el => el.classList.remove('show'));
    $('addModal').classList.add('open');
    $('aName').focus();
  }

  const closeAdd = () => $('addModal').classList.remove('open');

  function submitAdd(e) {
    e.preventDefault();
    const g = groups.find(x => x.key === current);
    const name = $('aName').value.trim();
    const rateText = $('aRate').value.trim();

    let nameMsg = '';
    if (g.key === 'category') nameMsg = checkCategoryName(name);   // 구분명은 중복 허용 (빈 값·길이만 검사)
    else if (!name) nameMsg = `${g.label} 이름을 입력하세요.`;
    else if (g.items.some(x => x.name === name)) nameMsg = `이미 등록된 ${g.label} 이름입니다.`;
    $('eName').textContent = nameMsg;
    $('eName').classList.toggle('show', !!nameMsg);

    const it = {
      code: 'c' + Date.now().toString(36),
      name,
      desc: $('aDesc').value.trim(),
      memos: [],
      history: [{ at: fmtDateTime(new Date()), content: '항목 생성', by: ADMIN_NAME }]
    };

    if (g.key === 'grade') {
      const c = GradeCriteria.read('ac');
      const r = GradeBenefit.read('ag');
      if (nameMsg || c.error || r.error) return;
      it.criteria = c.value;
      it.benefit = r.value;
    } else {
      const rateOk = /^\d{1,3}$/.test(rateText) && Number(rateText) <= 100;
      $('eRate').classList.toggle('show', !rateOk);
      let subsMsg = '';
      if (g.key === 'category') {
        const sub = $('aSubs').value.trim();
        if (sub) subsMsg = checkSub(sub, []);
        it.subs = sub ? [sub] : [];
        $('eSubs').textContent = subsMsg;
        $('eSubs').classList.toggle('show', !!subsMsg);
      }
      if (nameMsg || !rateOk || subsMsg) return;
      it.discountRate = Number(rateText);
      flagsFor(g.key).forEach(f => { it[f.key] = document.querySelector(`input[name=a_${f.key}]:checked`).value === 'Y'; });
    }

    // TODO: 실서비스에서는 POST /api/admin/member-types/{group} 호출
    g.items.push(it);
    const saved = save(groups);
    closeAdd();
    render();
    toast(saved ? `'${name}' ${g.label}이(가) 추가되었습니다.` : '저장소를 사용할 수 없어 이 화면에만 반영되었습니다.');
  }

  $('btnAdd').addEventListener('click', openAdd);
  $('addForm').addEventListener('submit', submitAdd);
  document.querySelectorAll('#addModal [data-close]').forEach(b => b.addEventListener('click', closeAdd));
  $('addModal').addEventListener('click', e => { if (e.target === $('addModal')) closeAdd(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAdd(); });

  initSidebar();
  render();
  // 상세에서 삭제 후 돌아온 경우 안내
  if (params.get('deleted')) toast(`'${params.get('deleted')}' 구분이 삭제되었습니다.`);
})();
</script>
</body>
</html>
