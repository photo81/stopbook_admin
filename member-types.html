<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑북 관리자 - 회원 유형 관리</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">STOPBOOK Admin</div>
    <ul>
      <li><a href="#">대시보드</a></li>
      <li class="has-sub open">
        <a href="#" class="menu-parent" aria-expanded="true">회원관리<span class="chev">▼</span></a>
        <ul class="submenu">
          <li><a href="members.html">회원 리스트</a></li>
          <li><a href="group-applications.html">단체 회원 신청 리스트</a></li>
          <li><a href="withdrawn.html">탈퇴회원 리스트</a></li>
          <li><a href="member-types.html" class="active" aria-current="page">회원 유형 관리</a></li>
        </ul>
      </li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">홈 &gt; 회원관리 &gt; <b>회원 유형 관리</b></div>
      <div>관리자님 | <a href="#">로그아웃</a></div>
    </header>

    <main class="content">
      <h1>회원 유형 관리</h1>

      <div class="tabs" role="tablist" id="tabs"></div>

      <section class="panel tab-panel" role="tabpanel" id="tabPanel">
        <div class="list-head">
          <div class="count" id="tabGuide"></div>
          <div class="right">
            <button type="button" class="btn btn-primary" id="btnAdd"></button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="listTable">
            <thead>
              <tr id="headRow"></tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- 항목 추가 모달 -->
<div class="modal-bg" id="addModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="modal-header">
      <h2 id="addTitle"></h2>
      <button type="button" class="close" data-close aria-label="닫기">&times;</button>
    </div>
    <form id="addForm" class="modal-body" novalidate>
      <div class="section-title">기본 정보</div>
      <table class="form-table">
        <tr><th id="addNameLabel"></th><td>
          <input type="text" id="aName" maxlength="20">
          <div class="err" id="eName"></div>
        </td></tr>
        <tr><th>설명</th><td><textarea id="aDesc" maxlength="300"></textarea></td></tr>
      </table>

      <div class="section-title">혜택 설정</div>
      <table class="form-table" id="addFlagTable">
        <tbody id="addFlagRows"></tbody>
        <tr><th>할인율</th><td>
          <input type="text" id="aRate" inputmode="numeric" style="width:100px" value="0"> %
          <span class="readonly" style="margin-left:8px">0~100 사이 정수</span>
          <div class="err" id="eRate">할인율은 0~100 사이의 정수로 입력하세요.</div>
        </td></tr>
      </table>
      <!-- 등급 탭 전용: 정기 지급 혜택 -->
      <table class="form-table" id="addGradeTable" hidden>
        <tbody id="addGradeRows"></tbody>
      </table>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn" data-close>취소</button>
      <button type="submit" form="addForm" class="btn btn-primary">추가</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="member-type-store.js"></script>
<script>
(function () {
  'use strict';
  const { esc, toast, fmtDateTime, initSidebar, ADMIN_NAME } = AdminUtil;
  const { load, save, flagsFor, GradeBenefit } = MemberTypeStore;
  const $ = id => document.getElementById(id);
  const groups = load();
  const SNS_TYPES = ['카카오회원', '네이버회원', '구글회원'];   // 로고 표시 대상 (admin.css .ty-*)

  const yn = (it, f) => `<span class="${it[f.key] ? 'yn-on' : 'yn-off'}">${it[f.key] ? f.on : f.off}</span>`;

  // 구분/유형 탭 목록 열: 탭에서 쓰는 혜택 항목을 하나씩 열로 표시
  const COLUMN_LABELS = { mileageEarn: '마일리지 적립', mileageUse: '마일리지 사용', couponUse: '쿠폰 사용', stackOther: '타할인중복', stackEvent: '이벤트중복' };
  const flagColumns = groupKey => flagsFor(groupKey).filter(f => COLUMN_LABELS[f.key]);

  // 상세에서 돌아올 때 같은 탭을 유지하도록 ?tab= 사용
  const params = new URLSearchParams(location.search);
  let current = groups.some(g => g.key === params.get('tab')) ? params.get('tab') : groups[0].key;

  function render() {
    const g = groups.find(x => x.key === current);
    $('tabs').innerHTML = groups.map(x => `
      <button type="button" role="tab" class="tab ${x.key === current ? 'active' : ''}"
        aria-selected="${x.key === current}" data-tab="${x.key}">${esc(x.label)} <span class="tab-count">${x.items.length}</span></button>`).join('');
    const isGrade = g.key === 'grade';
    const heads = isGrade
      ? [g.label, '지급 주기', '쿠폰', '마일리지 지급', '할인 적용', '설명']
      : [g.label, ...flagColumns(g.key).map(f => COLUMN_LABELS[f.key]), '할인율설정', '설명'];
    const numCols = isGrade ? [3, 4] : [];   // 숫자 열은 제목도 오른쪽 정렬
    // 구분/유형 탭: 설명을 뺀 열은 같은 너비로 고정, 설명은 남는 폭 사용
    $('listTable').classList.toggle('equal-cols', !isGrade);
    $('headRow').innerHTML = heads.map((h, i) => `<th${numCols.includes(i) ? ' style="text-align:right"' : ''}>${h}</th>`).join('');
    $('btnAdd').textContent = `+ ${g.label} 추가`;
    $('tabGuide').textContent = isGrade
      ? '등급별 정기 지급 혜택 · 등급 이름을 누르면 상세 설정으로 이동합니다.'
      : `${g.label}별 혜택 설정 · ${g.label} 이름을 누르면 상세 설정으로 이동합니다.`;

    const nameCell = it => `<td><a class="name-link" href="member-type-detail.html?group=${encodeURIComponent(g.key)}&code=${encodeURIComponent(it.code)}">${SNS_TYPES.includes(it.name) ? `<span class="type-logo ty-${esc(it.name)}"></span>` : ''}${esc(it.name)}</a></td>`;
    const descCell = it => `<td class="left cat-desc" title="${esc(it.desc)}">${esc(it.desc)}</td>`;
    const off = t => `<span class="yn-off">${t}</span>`;

    $('listBody').innerHTML = g.items.map(it => {
      if (isGrade) {
        const b = it.benefit;
        return `<tr>
          ${nameCell(it)}
          <td>${b.cycle === 'none' ? off('지급 안 함') : esc(GradeBenefit.cycleText(b))}</td>
          <td class="cat-desc" title="${esc(b.coupons.join(', '))}">${b.coupons.length ? `<b>${b.coupons.length}종</b> <span class="readonly">${esc(b.coupons.join(', '))}</span>` : off('없음')}</td>
          <td class="num">${b.mileageOn ? GradeBenefit.mileageText(b) : off('없음')}</td>
          <td class="num">${b.discountOn ? GradeBenefit.discountText(b) : off('없음')}</td>
          ${descCell(it)}
        </tr>`;
      }
      return `<tr>
        ${nameCell(it)}
        ${flagColumns(g.key).map(f => `<td>${yn(it, f)}</td>`).join('')}
        <td>${it.discountRate}%</td>
        ${descCell(it)}
      </tr>`;
    }).join('');
  }

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b || b.dataset.tab === current) return;
    current = b.dataset.tab;
    try { history.replaceState(null, '', `?tab=${current}`); } catch (err) { /* file:// 등에서 차단될 수 있음 */ }
    render();
  });

  // ===== 항목 추가 모달 =====
  const renderAddFlagRows = groupKey => { $('addFlagRows').innerHTML = flagsFor(groupKey).map(f => `
    <tr><th>${f.label}</th><td>
      <label><input type="radio" name="a_${f.key}" value="Y"> ${f.on}</label>
      <label style="margin-left:12px"><input type="radio" name="a_${f.key}" value="N"> ${f.off}</label>
    </td></tr>`).join(''); };

  $('addGradeRows').innerHTML = GradeBenefit.formHtml('ag');
  GradeBenefit.bind('ag');

  const DEFAULT_FLAGS = {mileageEarn: true, mileageUse: true, couponUse: true, stackOther: false, stackEvent: true };

  function openAdd() {
    const g = groups.find(x => x.key === current);
    $('addTitle').textContent = `${g.label} 추가`;
    $('addNameLabel').textContent = `${g.label} 이름 *`;
    $('addForm').reset();
    renderAddFlagRows(g.key);
    flagsFor(g.key).forEach(f => { document.querySelector(`input[name=a_${f.key}][value=${DEFAULT_FLAGS[f.key] ? 'Y' : 'N'}]`).checked = true; });
    $('aRate').value = '0';
    const isGrade = g.key === 'grade';
    $('addFlagTable').hidden = isGrade;
    $('addGradeTable').hidden = !isGrade;
    if (isGrade) GradeBenefit.fill('ag', GradeBenefit.empty());
    document.querySelectorAll('#addForm .err').forEach(el => el.classList.remove('show'));
    $('addModal').classList.add('open');
    $('aName').focus();
  }

  const closeAdd = () => $('addModal').classList.remove('open');

  function submitAdd(e) {
    e.preventDefault();
    const g = groups.find(x => x.key === current);
    const name = $('aName').value.trim();
    const rateText = $('aRate').value.trim();

    let nameMsg = '';
    if (!name) nameMsg = `${g.label} 이름을 입력하세요.`;
    else if (g.items.some(x => x.name === name)) nameMsg = `이미 등록된 ${g.label} 이름입니다.`;
    $('eName').textContent = nameMsg;
    $('eName').classList.toggle('show', !!nameMsg);

    const it = {
      code: 'c' + Date.now().toString(36),
      name,
      desc: $('aDesc').value.trim(),
      memos: [],
      history: [{ at: fmtDateTime(new Date()), content: '항목 생성', by: ADMIN_NAME }]
    };

    if (g.key === 'grade') {
      const r = GradeBenefit.read('ag');
      if (nameMsg || r.error) return;
      it.benefit = r.value;
    } else {
      const rateOk = /^\d{1,3}$/.test(rateText) && Number(rateText) <= 100;
      $('eRate').classList.toggle('show', !rateOk);
      if (nameMsg || !rateOk) return;
      it.discountRate = Number(rateText);
      flagsFor(g.key).forEach(f => { it[f.key] = document.querySelector(`input[name=a_${f.key}]:checked`).value === 'Y'; });
    }

    // TODO: 실서비스에서는 POST /api/admin/member-types/{group} 호출
    g.items.push(it);
    const saved = save(groups);
    closeAdd();
    render();
    toast(saved ? `'${name}' ${g.label}이(가) 추가되었습니다.` : '저장소를 사용할 수 없어 이 화면에만 반영되었습니다.');
  }

  $('btnAdd').addEventListener('click', openAdd);
  $('addForm').addEventListener('submit', submitAdd);
  document.querySelectorAll('#addModal [data-close]').forEach(b => b.addEventListener('click', closeAdd));
  $('addModal').addEventListener('click', e => { if (e.target === $('addModal')) closeAdd(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAdd(); });

  initSidebar();
  render();
})();
</script>
</body>
</html>
