<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑북 관리자 - 회원 유형 상세</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">STOPBOOK Admin</div>
    <ul>
      <li><a href="#">대시보드</a></li>
      <li class="has-sub open">
        <a href="#" class="menu-parent" aria-expanded="true">회원관리<span class="chev">▼</span></a>
        <ul class="submenu">
          <li><a href="members.html">회원 리스트</a></li>
          <li><a href="group-applications.html">단체 회원 신청 리스트</a></li>
          <li><a href="withdrawn.html">탈퇴회원 리스트</a></li>
          <li><a href="member-types.html" class="active" aria-current="page">회원 유형 관리</a></li>
        </ul>
      </li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">홈 &gt; 회원관리 &gt; <a href="member-types.html">회원 유형 관리</a> &gt; <a id="crumbGroup" href="member-types.html"></a> &gt; <b id="crumbName">상세</b></div>
      <div>관리자님 | <a href="#">로그아웃</a></div>
    </header>

    <main class="content">
      <h1 id="pageTitle">회원 유형 상세</h1>

      <div class="panel" id="notFound" hidden>
        존재하지 않는 항목입니다. <a href="member-types.html">목록으로 돌아가기</a>
      </div>

      <form class="panel" id="editForm" novalidate hidden>
        <div class="section-title">기본 정보</div>
        <table class="form-table">
          <tr><th id="nameLabel"></th><td class="readonly" id="fName"></td></tr>
          <tr><th>설명</th><td><textarea id="fDesc" maxlength="300"></textarea></td></tr>
        </table>

        <!-- 등급 전용: 평가 기준 (평가 조건은 목록 상단에서 설정, 여기서는 등급별 기준값만) -->
        <div class="section-title" id="criteriaTitle" hidden>평가 기준</div>
        <table class="form-table" id="criteriaTable" hidden>
          <tr><th>평가 조건</th><td>
            <span class="readonly" id="policySummary"></span>
            <a id="policyLink" href="member-types.html?tab=grade" style="margin-left:8px">변경</a>
          </td></tr>
          <tbody id="criteriaRows"></tbody>
        </table>

        <div class="section-title" id="benefitTitle">혜택 설정</div>
        <!-- 등급 전용: 정기 지급 혜택 -->
        <table class="form-table" id="gradeTable" hidden>
          <tbody id="gradeRows"></tbody>
        </table>
        <table class="form-table" id="flagTable">
          <tbody id="flagRows"></tbody>
          <tr><th>할인율</th><td>
            <input type="text" id="fRate" inputmode="numeric" style="width:100px"> %
            <span class="readonly" style="margin-left:8px">0~100 사이 정수</span>
            <div class="err" id="eRate">할인율은 0~100 사이의 정수로 입력하세요.</div>
          </td></tr>
        </table>

        <div class="section-title">관리자 메모</div>
        <table class="form-table">
          <tr><th>관리자 메모</th><td>
            <ul class="memo-list" id="memoList"></ul>
            <textarea id="fMemo" placeholder="새 메모 입력 후 저장하면 작성일시와 작성자가 함께 기록됩니다."></textarea>
          </td></tr>
        </table>

        <div class="section-title">변경 히스토리</div>
        <div class="table-wrap history-wrap">
          <table class="history-table change-table">
            <thead><tr><th style="width:130px">변경일시</th><th>변경 내용</th><th style="width:90px">변경 담당자</th></tr></thead>
            <tbody id="changeHistory"></tbody>
          </table>
        </div>

        <div class="page-actions">
          <a class="btn" id="btnList" href="member-types.html">목록</a>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="member-type-store.js"></script>
<script>
(function () {
  'use strict';
  const { esc, toast, fmtDateTime, initSidebar, ADMIN_NAME } = AdminUtil;
  const { load, save, flagsFor, GradeBenefit, GradePolicy, GradeCriteria } = MemberTypeStore;
  const $ = id => document.getElementById(id);

  initSidebar();

  const params = new URLSearchParams(location.search);
  const groups = load();
  const group = groups.find(g => g.key === params.get('group'));
  const it = group && group.items.find(x => x.code === params.get('code'));
  if (!it) { $('notFound').hidden = false; return; }
  const FLAGS = flagsFor(group.key);   // 탭에서 쓰는 혜택 항목만 (예: 유형 탭은 타할인 중복 없음)

  // ===== 화면 구성 =====
  const listUrl = `member-types.html?tab=${encodeURIComponent(group.key)}`;
  document.title = `스탑북 관리자 - 회원 유형 상세 (${group.label}: ${it.name})`;
  $('pageTitle').textContent = `회원 유형 상세 - ${group.label}: ${it.name}`;
  $('crumbGroup').textContent = group.label;
  $('crumbGroup').href = listUrl;
  $('btnList').href = listUrl;
  $('crumbName').textContent = it.name;
  $('nameLabel').textContent = group.label;
  $('fName').textContent = it.name;

  // 등급은 정기 지급 혜택만, 그 외(구분/유형)는 혜택 플래그 + 할인율
  const isGrade = group.key === 'grade';
  const policy = isGrade ? Object.assign(GradePolicy.empty(), group.policy) : null;
  $('gradeTable').hidden = !isGrade;
  $('flagTable').hidden = isGrade;
  $('criteriaTitle').hidden = !isGrade;
  $('criteriaTable').hidden = !isGrade;
  if (isGrade) {
    it.criteria = Object.assign(GradeCriteria.empty(), it.criteria);
    $('policySummary').textContent = GradePolicy.summary(policy);
    $('criteriaRows').innerHTML = GradeCriteria.formHtml('c', policy.basis);
    $('benefitTitle').textContent = '등급 혜택 (정기 지급)';
    $('gradeRows').innerHTML = GradeBenefit.formHtml('g');
    GradeBenefit.bind('g');
  } else {
    $('flagRows').innerHTML = FLAGS.map(f => `
      <tr><th>${f.label}</th><td>
        <label><input type="radio" name="${f.key}" value="Y"> ${f.on}</label>
        <label style="margin-left:12px"><input type="radio" name="${f.key}" value="N"> ${f.off}</label>
      </td></tr>`).join('');
  }

  function fillForm() {
    $('fDesc').value = it.desc;
    if (isGrade) {
      GradeCriteria.fill('c', it.criteria);
      GradeBenefit.fill('g', it.benefit);
    } else {
      $('fRate').value = it.discountRate;
      FLAGS.forEach(f => { document.querySelector(`input[name=${f.key}][value=${it[f.key] ? 'Y' : 'N'}]`).checked = true; });
    }
    $('fMemo').value = '';
    $('memoList').hidden = !it.memos.length;
    $('memoList').innerHTML = it.memos.map(x =>
      `<li><span class="memo-text">${esc(x.text)}</span> <span class="memo-meta">(${x.at} · ${esc(x.by)})</span></li>`).join('');
    $('changeHistory').innerHTML = it.history.slice().reverse().map(h => `
      <tr><td>${h.at}</td><td class="left">${esc(h.content)}</td><td>${esc(h.by)}</td></tr>`).join('');
  }

  // ===== 저장 (페이지 유지, 변경분은 히스토리로 기록) =====
  $('editForm').addEventListener('submit', e => {
    e.preventDefault();

    const next = { desc: $('fDesc').value.trim() };
    const changes = [];

    if (isGrade) {
      const c = GradeCriteria.read('c');
      const r = GradeBenefit.read('g');
      if (c.error || r.error) return;
      next.criteria = c.value;
      next.benefit = r.value;
      changes.push(...GradeCriteria.diff(it.criteria, c.value));
      changes.push(...GradeBenefit.diff(it.benefit, r.value));
    } else {
      const rateText = $('fRate').value.trim();
      const rateOk = /^\d{1,3}$/.test(rateText) && Number(rateText) <= 100;
      $('eRate').classList.toggle('show', !rateOk);
      if (!rateOk) return;
      next.discountRate = Number(rateText);
      FLAGS.forEach(f => { next[f.key] = document.querySelector(`input[name=${f.key}]:checked`).value === 'Y'; });
      FLAGS.forEach(f => {
        if (it[f.key] !== next[f.key]) changes.push(`${f.label} 변경: ${it[f.key] ? f.on : f.off} → ${next[f.key] ? f.on : f.off}`);
      });
      if (it.discountRate !== next.discountRate) changes.push(`할인율 변경: ${it.discountRate}% → ${next.discountRate}%`);
    }
    if (it.desc !== next.desc) changes.push('설명 변경');
    const memoText = $('fMemo').value.trim();

    if (!changes.length && !memoText) { toast('변경된 내용이 없습니다.'); return; }

    const now = fmtDateTime(new Date());
    Object.assign(it, next);
    changes.forEach(content => it.history.push({ at: now, content, by: ADMIN_NAME }));
    if (memoText) {
      it.memos.push({ text: memoText, at: now, by: ADMIN_NAME });
      it.history.push({ at: now, content: `관리자 메모 작성: ${memoText.length > 30 ? memoText.slice(0, 30) + '…' : memoText}`, by: ADMIN_NAME });
    }

    // TODO: 실서비스에서는 PUT /api/admin/member-types/{group}/{code} 호출 (서버에서 히스토리 기록)
    const saved = save(groups);
    fillForm();
    toast(saved ? '저장되었습니다.' : '저장소를 사용할 수 없어 이 화면에만 반영되었습니다.');
  });

  $('editForm').hidden = false;
  fillForm();
})();
</script>
</body>
</html>
