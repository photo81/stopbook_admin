<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑북 관리자 - 탈퇴회원 리스트</title>
<link rel="stylesheet" href="admin.css?v=20261009">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">STOPBOOK Admin</div>
    <ul>
      <li class="has-sub open">
        <a href="#" class="menu-parent" aria-expanded="true">회원관리<span class="chev">▼</span></a>
        <ul class="submenu">
          <li><a href="members.html">회원 리스트</a></li>
          <li><a href="group-applications.html">단체 회원 신청 리스트</a></li>
          <li><a href="withdrawn.html" class="active" aria-current="page">탈퇴회원 리스트</a></li>
          <li><a href="member-types.html">회원 유형 관리</a></li>
        </ul>
      </li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">홈 &gt; 회원관리 &gt; <b>탈퇴회원 리스트</b></div>
      <div>관리자님 | <a href="#">로그아웃</a></div>
    </header>

    <main class="content">
      <h1>탈퇴회원 리스트</h1>

      <!-- 검색 조건 -->
      <form class="panel" id="searchForm">
        <div class="search-grid">
          <div class="field">
            <label for="sKeyword">아이디</label>
            <input type="text" id="sKeyword" placeholder="아이디 입력">
          </div>
          <div class="field">
            <label>탈퇴일</label>
            <div class="range">
              <input type="date" id="sFrom"> ~ <input type="date" id="sTo">
            </div>
          </div>
          <div class="field">
            <label for="sReasonType">탈퇴구분</label>
            <select id="sReasonType">
              <option value="">전체</option>
              <option>자진탈퇴</option><option>강제탈퇴</option><option>장기미이용</option>
            </select>
          </div>
        </div>
        <div class="search-actions">
          <button type="submit" class="btn btn-primary">검색</button>
          <button type="button" class="btn" id="btnReset">초기화</button>
        </div>
      </form>

      <!-- 탈퇴회원 목록 -->
      <section class="panel">
        <div class="list-head">
          <div class="count">검색결과 <b id="totalCount">0</b>명 / 전체 <span id="allCount">0</span>명</div>
          <div class="right">
            <select id="pageSize">
              <option value="10">10개씩</option>
              <option value="20" selected>20개씩</option>
              <option value="50">50개씩</option>
            </select>
            <button type="button" class="btn btn-excel" id="btnExcel">엑셀 다운로드</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="wd-table">
            <thead>
              <tr>
                <th class="sortable col-no" data-key="no">번호</th>
                <th class="sortable w-id" data-key="userId">아이디</th>
                <th class="sortable w-cnt" data-key="orderCount">주문수량</th>
                <th class="sortable w-amt" data-key="orderAmount">주문금액</th>
                <th class="sortable w-date" data-key="joinDate">가입일</th>
                <th class="sortable w-date" data-key="withdrawDate">탈퇴일</th>
                <th class="sortable w-type" data-key="reasonType">탈퇴구분</th>
                <th>상세사유</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>
</div>

<!-- 상세사유 모달 -->
<div class="modal-bg" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">탈퇴 상세사유</h2>
      <button type="button" class="close" data-close aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body">
      <table class="form-table">
        <tr><th>아이디</th><td id="mUserId"></td></tr>
        <tr><th>가입일</th><td id="mJoinDate"></td></tr>
        <tr><th>탈퇴일</th><td id="mWithdrawDate"></td></tr>
        <tr><th>탈퇴구분</th><td id="mReasonType"></td></tr>
        <tr><th>상세사유</th><td class="reason-full" id="mReason"></td></tr>
      </table>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" data-close>닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ===== 샘플 데이터 (실서비스에서는 API 응답으로 대체) =====
  const REASON_TYPES = ['자진탈퇴', '자진탈퇴', '자진탈퇴', '강제탈퇴', '장기미이용'];
  const REASONS = {
    '자진탈퇴': ['서비스를 더 이상 이용하지 않음', '원하는 도서가 부족함', '배송이 느림', '다른 서비스를 이용하기로 함', '개인정보 보호를 위해 탈퇴', '가격이 비쌈'],
    '강제탈퇴': ['부정 거래 이력으로 관리자 탈퇴 처리', '이용약관 위반(욕설·비방 게시글 반복 작성)', '타인 명의 도용 확인'],
    '장기미이용': ['휴면 전환 후 1년 경과로 자동 탈퇴']
  };

  let seed = 7;
  const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pick = arr => arr[Math.floor(rand() * arr.length)];
  const pad = n => String(n).padStart(2, '0');
  const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const won = n => n.toLocaleString() + '원';

  const items = [];
  const base = new Date(2026, 9, 1).getTime();
  for (let i = 1; i <= 64; i++) {
    const withdraw = new Date(base - Math.floor(rand() * 365) * 86400000);
    const join = new Date(withdraw.getTime() - (30 + Math.floor(rand() * 900)) * 86400000);
    const reasonType = pick(REASON_TYPES);
    const orderCount = reasonType === '장기미이용' ? Math.floor(rand() * 3) : Math.floor(rand() * 40);
    items.push({
      no: i,
      userId: 'out' + String(100 + i),
      orderCount,
      orderAmount: orderCount * (8000 + Math.floor(rand() * 20) * 1000),
      joinDate: fmtDate(join),
      withdrawDate: fmtDate(withdraw),
      reasonType,
      reason: pick(REASONS[reasonType])
    });
  }

  // ===== 상태 =====
  const state = { filtered: [], page: 1, size: 20, sortKey: 'withdrawDate', sortDir: 'desc' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ===== 검색 =====
  function applyFilter() {
    const kw = $('sKeyword').value.trim().toLowerCase();
    const from = $('sFrom').value;
    const to = $('sTo').value;
    const type = $('sReasonType').value;

    if (from && to && from > to) { toast('탈퇴일 시작일이 종료일보다 늦습니다.'); return false; }

    state.filtered = items.filter(m =>
      (!kw || m.userId.toLowerCase().includes(kw)) &&
      (!from || m.withdrawDate >= from) &&
      (!to || m.withdrawDate <= to) &&
      (!type || m.reasonType === type)
    );
    sortData();
    return true;
  }

  function sortData() {
    const { sortKey: k, sortDir: d } = state;
    state.filtered.sort((a, b) => {
      const r = typeof a[k] === 'number' ? a[k] - b[k] : String(a[k]).localeCompare(String(b[k]), 'ko');
      return d === 'asc' ? r : -r;
    });
  }

  // ===== 렌더링 =====
  function render() {
    const total = state.filtered.length;
    const pages = Math.max(1, Math.ceil(total / state.size));
    if (state.page > pages) state.page = pages;
    const start = (state.page - 1) * state.size;
    const rows = state.filtered.slice(start, start + state.size);

    $('totalCount').textContent = total.toLocaleString();
    $('allCount').textContent = items.length.toLocaleString();

    $('listBody').innerHTML = rows.length ? rows.map(m => `
      <tr>
        <td>${m.no}</td>
        <td>${esc(m.userId)}</td>
        <td class="num">${m.orderCount.toLocaleString()}</td>
        <td class="num">${won(m.orderAmount)}</td>
        <td>${m.joinDate}</td>
        <td>${m.withdrawDate}</td>
        <td><span class="badge wd-${m.reasonType}">${m.reasonType}</span></td>
        <td class="reason"><a class="name-link" data-no="${m.no}" title="${esc(m.reason)}">${esc(m.reason)}</a></td>
      </tr>`).join('')
      : '<tr><td colspan="8" class="empty">검색 결과가 없습니다.</td></tr>';

    document.querySelectorAll('th.sortable').forEach(th => {
      const active = th.dataset.key === state.sortKey;
      const label = th.textContent.replace(/[▲▼↕]/g, '').trim();
      th.innerHTML = `${label}<span class="arrow">${active ? (state.sortDir === 'asc' ? '▲' : '▼') : '↕'}</span>`;
    });

    renderPagination(pages);
  }

  function renderPagination(pages) {
    const cur = state.page;
    const blockStart = Math.floor((cur - 1) / 10) * 10 + 1;
    const blockEnd = Math.min(pages, blockStart + 9);
    let html = `<button data-page="1" ${cur === 1 ? 'disabled' : ''}>«</button>`;
    html += `<button data-page="${cur - 1}" ${cur === 1 ? 'disabled' : ''}>‹</button>`;
    for (let p = blockStart; p <= blockEnd; p++) {
      html += `<button data-page="${p}" class="${p === cur ? 'active' : ''}">${p}</button>`;
    }
    html += `<button data-page="${cur + 1}" ${cur === pages ? 'disabled' : ''}>›</button>`;
    html += `<button data-page="${pages}" ${cur === pages ? 'disabled' : ''}>»</button>`;
    $('pagination').innerHTML = html;
  }

  // ===== 상세사유 모달 =====
  function openModal(no) {
    const m = items.find(x => x.no === no);
    if (!m) return;
    $('mUserId').textContent = m.userId;
    $('mJoinDate').textContent = m.joinDate;
    $('mWithdrawDate').textContent = m.withdrawDate;
    $('mReasonType').textContent = m.reasonType;
    $('mReason').textContent = m.reason;
    $('modal').classList.add('open');
  }
  const closeModal = () => $('modal').classList.remove('open');

  // ===== 엑셀(CSV) 다운로드 =====
  function downloadExcel() {
    if (!state.filtered.length) { toast('다운로드할 데이터가 없습니다.'); return; }
    const cols = [
      ['no', '번호'], ['userId', '아이디'], ['orderCount', '주문수량'], ['orderAmount', '주문금액'],
      ['joinDate', '가입일'], ['withdrawDate', '탈퇴일'], ['reasonType', '탈퇴구분'], ['reason', '상세사유']
    ];
    const cell = v => {
      let s = String(v ?? '');
      if (/^[=+\-@]/.test(s)) s = "'" + s;            // CSV 수식 주입 방지
      return '"' + s.replace(/"/g, '""') + '"';
    };
    const lines = [cols.map(c => cell(c[1])).join(',')];
    state.filtered.forEach(m => lines.push(cols.map(([k]) => cell(m[k])).join(',')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `탈퇴회원목록_${fmtDate(new Date()).replace(/-/g, '')}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    toast(`${state.filtered.length}명의 탈퇴회원 정보를 다운로드했습니다.`);
  }

  // ===== 토스트 =====
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ===== 사이드바 하위메뉴 접기/펼치기 =====
  document.querySelectorAll('.sidebar .menu-parent').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const open = a.parentElement.classList.toggle('open');
    a.setAttribute('aria-expanded', String(open));
  }));

  // ===== 이벤트 =====
  $('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    if (applyFilter()) { state.page = 1; render(); }
  });
  $('btnReset').addEventListener('click', () => {
    $('searchForm').reset();
    applyFilter(); state.page = 1; render();
  });
  $('pageSize').addEventListener('change', e => {
    state.size = Number(e.target.value); state.page = 1; render();
  });
  $('btnExcel').addEventListener('click', downloadExcel);

  document.querySelector('thead').addEventListener('click', e => {
    const th = e.target.closest('th.sortable');
    if (!th) return;
    const key = th.dataset.key;
    if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = key; state.sortDir = 'asc'; }
    sortData(); render();
  });
  $('listBody').addEventListener('click', e => {
    const el = e.target.closest('[data-no]');
    if (el) openModal(Number(el.dataset.no));
  });
  $('pagination').addEventListener('click', e => {
    const b = e.target.closest('button[data-page]');
    if (b && !b.disabled) { state.page = Number(b.dataset.page); render(); }
  });

  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // 초기 로드
  applyFilter();
  render();
})();
</script>
</body>
</html>
