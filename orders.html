</head>
<body>

  <aside class="sidebar">
    <div class="logo">STOPBOOK Admin</div>
    <ul>
      <li class="has-sub">
        <a href="#" class="menu-parent" aria-expanded="false">회원관리<span class="chev">▼</span></a>
        <ul class="submenu">
          <li><a href="members.html">회원 리스트</a></li>
          <li><a href="group-applications.html">단체회원 신청 리스트</a></li>
          <li><a href="withdrawn.html">탈퇴 회원 관리</a></li>
          <li><a href="member-types.html">회원 유형 관리</a></li>
        </ul>
      </li>
      <li class="has-sub open">
        <a href="#" class="menu-parent" aria-expanded="true">주문관리<span class="chev">▼</span></a>
        <ul class="submenu">
          <li><a href="orders.html" class="active" aria-current="page">주문접수 리스트</a></li>
          <li><a href="unpaid-orders.html">미입금 주문 리스트</a></li>
          <li><a href="postpay-orders.html">후결제 주문 리스트</a></li>
        </ul>
      </li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">홈 &gt; 주문관리 &gt; <b>주문접수 리스트</b></div>
      <div><span class="proto-ver" data-proto-version>프로토타입 v1.86 (2026-10-04)</span> 관리자님 | <a href="#">로그아웃</a></div>
    </header>

    <main class="content">
      <h1>주문접수 리스트</h1>

      <!-- 검색 조건: 검색어 + 기간이 기본, 상세검색은 접어 둠 -->
      <form class="panel" id="searchForm" novalidate>
        <div class="search-row">
          <div class="search-grid order-search">
            <div class="field f-keyword">
              <label for="sType">검색어</label>
              <select id="sType" style="flex:0 0 110px">
                <option value="all">전체</option>
                <option value="orderNo">주문번호</option>
                <option value="name">주문자명</option>
                <option value="recipient">수취인명</option>
                <option value="userId">아이디</option>
                <option value="email">이메일</option>
                <option value="phone">휴대폰</option>
                <option value="product">상품명</option>
              </select>
              <input type="text" id="sKeyword" placeholder="검색어 입력">
            </div>
            <div class="field f-period">
              <label for="sDateType">기간</label>
              <select id="sDateType" style="flex:0 0 100px">
                <option value="orderedAt">주문일</option>
                <option value="paidAt">결제일</option>
                <option value="shippedAt">배송시작일</option>
              </select>
              <div class="range">
                <input type="date" id="sFrom" aria-label="기간 시작"> ~ <input type="date" id="sTo" aria-label="기간 종료">
              </div>
              <div class="quick-range" role="group" aria-label="기간 빠른 선택">
                <button type="button" class="btn btn-xs" data-days="0">오늘</button>
                <button type="button" class="btn btn-xs" data-days="7">7일</button>
                <button type="button" class="btn btn-xs" data-days="30">1개월</button>
                <button type="button" class="btn btn-xs" data-days="90">3개월</button>
                <button type="button" class="btn btn-xs" data-days="all">전체</button>
              </div>
            </div>
          </div>
          <div class="search-actions">
            <button type="submit" class="btn btn-primary">검색</button>
            <button type="button" class="btn" id="btnReset">초기화</button>
          </div>
        </div>

        <button type="button" class="detail-toggle" id="btnDetail" aria-expanded="false" aria-controls="detailSearch">
          상세검색 <span id="detailCount"></span><span class="chev">▼</span>
        </button>
        <!-- 상세검색: 드롭다운 안에서 여러 값을 체크 (아무것도 고르지 않으면 전체). 선택지는 order-list.js에서 구성 -->
        <div class="search-grid detail-search" id="detailSearch" hidden></div>
      </form>

      <!-- 주문 목록: 결제가 끝난(입금 확인된) 주문. 무통장입금 미입금 건은 미입금 주문 리스트에 따로 표시 -->
      <section class="panel">
        <div class="list-head">
          <div class="count">검색결과 <b id="totalCount">0</b>건 / 전체 <span id="allCount">0</span>건 <span id="listGuide"></span></div>
          <div class="right">
            <select id="pageSize">
              <option value="10" selected>10개씩</option>
              <option value="20">20개씩</option>
              <option value="50">50개씩</option>
            </select>
            <!-- 엑셀 다운로드: 누르면 단위 선택 -->
            <div class="dl-wrap">
              <button type="button" class="btn btn-excel" id="btnExcel" aria-haspopup="menu" aria-expanded="false" aria-controls="dlMenu">엑셀 다운로드 ▾</button>
              <div class="dl-menu" id="dlMenu" role="menu" hidden>
                <button type="button" role="menuitem" data-unit="order"><b>주문번호 단위</b><span>주문 1건 = 1행</span></button>
                <button type="button" role="menuitem" data-unit="item"><b>상품 제작번호 단위</b><span>주문 상품 1개 = 1행 (옵션·공정 포함)</span></button>
              </div>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="order-table">
            <thead>
              <tr>
                <th class="w-env" title="결제 기기 (PC / MO)">기기</th>
                <th class="sortable w-dt" data-key="orderedAt">주문일시</th>
                <th class="sortable w-name" data-key="name">주문자명</th>
                <th class="w-email">이메일</th>
                <th class="sortable w-ono" data-key="orderNo">주문번호</th>
                <th class="w-prod">주문상품</th>
                <th class="sortable w-qty" data-key="qty">주문수량</th>
                <th class="sortable w-amt" data-key="listPrice">주문금액</th>
                <th class="sortable w-amt" data-key="discount">할인금액</th>
                <th class="sortable w-amt" data-key="amount">결제금액</th>
                <th class="w-pay">결제수단</th>
                <th class="w-st">결제상태</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="member-type-store.js?v=20261104"></script>
<script src="member-data.js?v=20261104"></script>

<script>OrderList.init({ mode: 'accepted' });</script>
</body>
</html>
